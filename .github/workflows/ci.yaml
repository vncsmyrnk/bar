name: CI workflow

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install dependencies
        run: nix profile add nixpkgs#shellcheck nixpkgs#shfmt

      - name: Bootstrap the build system
        run: autoreconf --install --force

      - name: Configure
        run: ./configure --with-preset=${{ matrix.preset }}

      - name: Build
        run: make

      - name: Run Distcheck
        run: make distcheck
